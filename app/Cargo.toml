[package]
name = "app"
license = "GPL-3.0-only"
version = "0.1.0"
authors = ["SimonVesely <simvesely@gmail.com>"]
edition = "2024"

[dependencies]
dioxus = { version = "0.7.1", features = ["router"] }
dioxus-desktop = "0.7"
dioxus-core    = "0.7"
proto-core     = { workspace = true }
proto-ftp      = { workspace = true }
proto-ftps     = { workspace = true }
tracing        = { workspace = true }
rfd            = "0.17"
tokio          = { workspace = true }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
