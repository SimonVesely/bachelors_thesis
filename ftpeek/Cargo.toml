[package]
name = "ftpeek"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["SimonVesely <simvesely@gmail.com>"]

[[bin]]
name = "FTPeek"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.1", features = ["router"] }
dioxus-desktop = "0.7"
dioxus-core    = "0.7"
proto-core     = { workspace = true, features = ["capture"] }
proto-ftp      = { workspace = true }
proto-ftps     = { workspace = true }
proto-tftp     = { workspace = true }
proto-sftp     = { workspace = true }
tracing        = { workspace = true }
rfd            = "0.17"
tokio          = { workspace = true }
directories    = "6"
base64         = "0.23.1"

[build-dependencies]
winresource = "0.1"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
