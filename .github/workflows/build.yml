name: Build binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # The line right under [workspace.package] is: version = "x.y.z"
          CARGO_VERSION=$(grep -A1 '^\[workspace.package\]' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p')
          if [ "v$CARGO_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "Version $CARGO_VERSION matches tag $GITHUB_REF_NAME"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_name: ftpeek-macos
            exe: FTPeek
          - os: windows-latest
            asset_name: ftpeek-windows
            exe: FTPeek.exe
          - os: ubuntu-latest
            asset_name: ftpeek-linux
            exe: FTPeek

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build portable binary
        run: cargo build --release --package ftpeek

      - name: Archive portable binary (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          # tar keeps the executable bit, so ./FTPeek runs right after unpacking.
          tar -czf "dist/${{ matrix.asset_name }}-portable.tar.gz" -C target/release "${{ matrix.exe }}"

      - name: Archive portable binary (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target\release\${{ matrix.exe }}" -DestinationPath "dist\${{ matrix.asset_name }}-portable.zip" -Force

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      - name: Bundle app (release)
        run: dx bundle --release --desktop --package ftpeek

      - name: Locate bundle
        shell: bash
        run: |
          BUNDLE_DIR=$(find target/dx -type d -iname "bundle" | head -n 1)
          if [ -z "$BUNDLE_DIR" ]; then
            echo "Could not locate dx bundle output under target/dx" >&2
            find target/dx -maxdepth 4 >&2
            exit 1
          fi
          echo "BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"

      - name: Archive installers (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd "$(dirname "$BUNDLE_DIR")"
          zip -r "$GITHUB_WORKSPACE/dist/${{ matrix.asset_name }}-installer.zip" "$(basename "$BUNDLE_DIR")"

      - name: Archive installers (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bundleDir = $env:BUNDLE_DIR -replace '/', '\'
          Compress-Archive -Path $bundleDir -DestinationPath "dist\${{ matrix.asset_name }}-installer.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*

  docs:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Add index page
        run: echo '<meta http-equiv="refresh" content="0; url=proto_core/index.html">' > target/doc/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
